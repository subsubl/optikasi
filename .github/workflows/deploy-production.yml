name: Deploy to Production (optikasi.si)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with Nuxt (static generation)
        run: pnpm run generate
        env:
          NUXT_APP_BASE_URL: /

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: .output/public
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      REMOTE_PATH: /home/subsubl01/public_html/optikasi.si
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./dist

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # Add host to known_hosts with timeout and retry
          echo "Adding host to known_hosts..."
          for i in {1..3}; do
            if ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "Host key added successfully"
              break
            else
              echo "Attempt $i failed, retrying in 5s..."
              sleep 5
            fi
          done

      - name: Test SSH connection
        run: |
          echo "Testing SSH connection..."
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/deploy_key -o ConnectTimeout=10 -o StrictHostKeyChecking=no \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "echo 'SSH connection successful' && ls -la $REMOTE_PATH"

      - name: Sync files to production server
        run: |
          echo "Deploying to ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$REMOTE_PATH"
          rsync -avz --delete -e "ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30" \
            ./dist/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$REMOTE_PATH/

      - name: Verify deployment
        run: |
          sleep 5
          echo "Checking deployment..."
          curl -sI https://optikasi.si | head -20
          echo ""
          echo "Deployment completed!"